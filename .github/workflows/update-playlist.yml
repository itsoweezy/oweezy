# Place this file at: .github/workflows/update-playlist.yml
#
# Runs every 6 hours, regenerates playlist.json from the live Spotify
# playlist (newest additions first, album art as ASCII, Apple Music links
# resolved automatically), and commits it. If your host deploys on push
# (GitHub Pages, Netlify, Vercel), the live widget updates itself.
#
# No token refresh workflow is needed here: the Spotify client-credentials
# flow mints a fresh token on every run from your client ID + secret, which
# don't expire.

name: Update ASCII playlist feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      refresh_all:
        description: "Force a full refresh (ignore cache, re-render every track's art)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run fetch-playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # Optional overrides — safe to leave unset.
          SPOTIFY_PLAYLIST_ID: ${{ vars.SPOTIFY_PLAYLIST_ID }}
          APPLE_MUSIC_PLAYLIST_URL: ${{ vars.APPLE_MUSIC_PLAYLIST_URL }}
          # Only set on a manual run with the "refresh_all" checkbox ticked;
          # the scheduled runs leave this unset so caching still applies.
          REFRESH_ALL: ${{ inputs.refresh_all && '1' || '' }}

      - name: Commit updated playlist
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add playlist.json
          git diff --staged --quiet || git commit -m "Update ASCII playlist feed"
          git push
