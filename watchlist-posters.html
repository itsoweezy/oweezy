<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watchlist Posters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap">
<style>
:root{--bg:#000;--ink:#f4f1f8;--muted:#9a93a8;--btn:#f4f1f8;--btn-ink:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;display:flex;flex-direction:column;justify-content:center;-webkit-text-size-adjust:100%}
.track{--h:max(150px,min(calc((100vh - 165px)/1.4),480px,100vw));--w:calc(var(--h)*.714);--gap:clamp(14px,3vw,32px);flex:none;display:flex;align-items:center;gap:var(--gap);overflow-x:auto;overflow-y:hidden;padding:12px calc(50% - var(--w)/2) calc(var(--w)*.56);scroll-snap-type:x mandatory;scrollbar-width:none;outline:none;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.dragging,.track.auto{scroll-snap-type:none}
.track.dragging{cursor:grabbing;user-select:none}
.card{position:relative;flex:none;width:var(--w);aspect-ratio:5/7;scroll-snap-align:center}
.poster{width:100%;height:100%;border-radius:10px;overflow:hidden;background:#111;box-shadow:0 34px 60px rgba(0,0,0,1),0 0 0 1px rgba(255,255,255,.12),0 0 80px rgba(255,255,255,.16)}
.card img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none}
.refl{position:absolute;left:0;right:0;top:100%;margin-top:3px;height:45%;overflow:hidden;border-radius:0 0 10px 10px;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 85%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 85%)}
.refl img{position:absolute;top:0;left:0;width:100%;height:222.3%;transform:scaleY(-1)}
.info{width:100%;max-width:560px;margin:0 auto;padding:4px 20px 22px;text-align:center}
.info h1{margin:0;min-height:2.5em;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,4.2vw,25px);letter-spacing:-.01em}
.info p{margin:4px 0 0;color:var(--muted);font-size:14px}
.nav{display:flex;gap:28px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
.nav button.step{width:44px;height:44px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-ink);font-size:18px;cursor:pointer}
.nav button:focus-visible,.track:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{width:100%}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<div class="track" id="track" tabindex="0" aria-label="Poster carousel. Scroll sideways, drag, or use arrow keys."></div>
<div class="info">
  <h1 id="name"></h1>
  <div class="nav">
    <button class="step" id="prev" aria-label="Previous show">&#8592;</button>
    <button class="step" id="next" aria-label="Next show">&#8594;</button>
  </div>
</div>
</div>

  const i=k*N+j,c=document.createElement('div');c.className='card';if(k!==1)c.setAttribute('aria-hidden','true');
  c.innerHTML='<div class="poster"><img draggable="false"></div><div class="refl" aria-hidden="true"><img draggable="false" alt=""></div>';
  const im=c.querySelector('.poster img');im.src=s.src;im.alt=label(s)+' poster';c.querySelector('.refl img').src=s.src;
  c.addEventListener('click',()=>{if(!moved)show(i)});
  track.appendChild(c);cards.push(c)});
function show(i){i=Math.max(0,Math.min(cards.length-1,i));const c=cards[i];track.scrollTo({left:c.offsetLeft-(track.clientWidth-c.offsetWidth)/2,behavior:reduce?'auto':'smooth'})}
function current(){const mid=track.scrollLeft+track.clientWidth/2;let best=0,bd=1e9;cards.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;best=i}});return best}
function update(){
  const mid=track.scrollLeft+track.clientWidth/2,idx=current();
  cards.forEach(c=>{const d=Math.min(Math.abs(c.offsetLeft+c.offsetWidth/2-mid)/(c.offsetWidth+20),1.4);
    c.style.transform='scale('+(1-d*.12)+')';c.style.opacity=1-d*.3});
  if(idx!==lastIdx){lastIdx=idx;nameEl.textContent=label(shows[idx%N])}
}
function posOf(i){const c=cards[i];return c.offsetLeft-(track.clientWidth-c.offsetWidth)/2}
function norm(){const c=posOf(N),W=c-posOf(0),p=track.scrollLeft;let d=0;if(W<=0)return 0;if(p<c-W/2)d=W;else if(p>=c+W/2)d=-W;if(d){track.scrollLeft=p+d;update()}return d}
function loop(t){
  const dt=Math.min((t-lastT)/1000,.1);lastT=t;
  if(!reduce){
    const blocked=hovering||down||t<idleUntil||!inView||document.hidden;
    if(blocked){
      if(interacted&&running){running=false;track.classList.remove('auto');if(!down)show(current())}
    }else{
      if(!running){running=true;interacted=false;track.classList.add('auto');phase='hold';pt=0}
      pt+=dt;
      if(phase==='hold'){
        if(pt>=HOLD){from=track.scrollLeft;to=posOf(current()+1);dur=Math.max(Math.abs(to-from)/SPEED,.3);phase='move';pt=0}
      }else{
        const k=Math.min(pt/dur,1);
        track.scrollLeft=from+(to-from)*(.5-.5*Math.cos(Math.PI*k));
        const d=norm();if(d){from+=d;to+=d}
        if(k>=1){phase='hold';pt=0}
      }
    }
  }
  requestAnimationFrame(loop)}
requestAnimationFrame(t=>{lastT=t;loop(t)});
track.addEventListener('scroll',()=>{if(!running)idleUntil=Math.max(idleUntil,performance.now()+1500);requestAnimationFrame(update);clearTimeout(nt);nt=setTimeout(()=>{if(!down&&!running)norm()},160)},{passive:true});
function init(){if(!track.clientWidth||!cards[0].offsetWidth)return;track.scrollLeft=posOf(N);update();ready=true}
new ResizeObserver(()=>{if(!ready){init();return}if(!running)show(current());update()}).observe(track);
if('IntersectionObserver' in window)new IntersectionObserver(es=>{inView=es[0].isIntersecting},{threshold:.05}).observe(wrap);
wrap.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hovering=true});
wrap.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hovering=false;idleUntil=performance.now()+700}});
track.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY))interact(4000)},{passive:true});
let sx=0,sl=0;
track.addEventListener('pointerdown',e=>{interact(4000);if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl=track.scrollLeft});
window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5){moved=true;track.classList.add('dragging')}if(moved){track.scrollLeft=sl-dx;const d=norm();if(d)sl+=d}});
window.addEventListener('pointerup',()=>{if(!down)return;down=false;track.classList.remove('dragging');if(moved)show(current());setTimeout(()=>moved=false,0)});
track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();interact(4000);show(current()+1)}if(e.key==='ArrowLeft'){e.preventDefault();interact(4000);show(current()-1)}});
document.getElementById('next').onclick=()=>{interact(4000);show(current()+1)};
document.getElementById('prev').onclick=()=>{interact(4000);show(current()-1)};
init();
</script>
</body>
</html>
